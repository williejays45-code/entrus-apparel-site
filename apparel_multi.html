<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EnTrus Apparel  Design Q&amp;A</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="multi">
  <div class="layout">
    <aside class="sidebar">
      <h2>ENTRUS APPAREL</h2>
      <p>Select a piece to view specs and ask questions.</p>
      <ul id="productList"></ul>
    </aside>

    <main class="product-area">
      <section id="productDisplay"></section>
    </main>

    <aside class="chat">
      <h3>DESIGN Q&amp;A  EnTrus Design Assistant</h3>
      <div id="chatWindow" class="chat-window"></div>
      <div class="chat-input-row">
        <input id="chatInput" placeholder="Ask about fit, material, care " />
        <button id="chatSend">Ask</button>
      </div>
    </aside>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
